openapi: 3.1.0
info:
  title: Pulseforge Events API
  version: 1.1.0
  description: Publish public service status and manage incident timelines.
servers:
  - url: https://status.example.com
tags:
  - name: Status
  - name: Incidents
  - name: Alert rules
paths:
  /v1/status:
    get:
      operationId: getStatus
      summary: Read the current public status
      responses:
        "200":
          description: Current service status and active incidents
  /v1/incidents:
    post:
      operationId: createIncident
      summary: Open an incident
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Incident created
  /v1/incidents/{incidentId}/updates:
    post:
      operationId: addIncidentUpdate
      summary: Add a timeline update
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: incidentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident updated
  /v1/incidents/{incidentId}/resolve:
    patch:
      operationId: resolveIncident
      summary: Resolve an incident
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: incidentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Incident resolved
  /v1/alert-rules:
    get:
      operationId: listAlertRules
      tags: [Alert rules]
      summary: List alert rules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every alert rule visible to the token
    post:
      operationId: createAlertRule
      tags: [Alert rules]
      summary: Create an alert rule
      description: Route selected incident events to an email or HTTPS webhook destination.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Alert rule created and enabled
        "400":
          description: Invalid destination or cooldown
  /v1/alert-rules/{ruleId}:
    get:
      operationId: getAlertRule
      tags: [Alert rules]
      summary: Get an alert rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Alert rule details
        "404":
          description: Alert rule not found
    patch:
      operationId: updateAlertRule
      tags: [Alert rules]
      summary: Update an alert rule
      description: Change routing, pause delivery, or adjust the cooldown.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Alert rule updated
    delete:
      operationId: deleteAlertRule
      tags: [Alert rules]
      summary: Delete an alert rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: Alert rule deleted
  /v1/alert-rules/{ruleId}/test:
    post:
      operationId: testAlertRule
      tags: [Alert rules]
      summary: Send a test alert
      description: Queue a synthetic event and record the resulting delivery attempt.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "202":
          description: Test delivery accepted
  /v1/alert-rules/{ruleId}/deliveries:
    get:
      operationId: listAlertDeliveries
      tags: [Alert rules]
      summary: List alert delivery history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Delivery attempts for the alert rule
components:
  parameters:
    RuleId:
      in: path
      name: ruleId
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
